<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header>
        <div class="tabbar">
            <img src="./src/assets/logoSinFondo.png" alt="logotipo">
            <nav>
                <a href="./index.html">Inicio</a>
                <a href="/src/pages/store/home/home.html">Catálogo</a>
                <a href="">Mis pedidos</a>

                <a href="/src/pages/admin/admin.html">Panel Admin</a>

        <article>
            <h2>Productos recomendados</h2>
            <div id="contenedor-recomendados" class="productos-grid"></div>

    <footer>
        <p>© 2026 Food Store. Todos los derechos reservados.</p><br>
        <p>Contacto: <a class="link-contact">foodstore@gmail.com</a></p>
    </footer>
